    <script>
      (function() {
        // Permanently satisfy and suppress Vite HMR WebSocket in AI Studio preview & Cloud Run
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite') !== -1 || (typeof url === 'string' && url.indexOf('vite') !== -1)) {
              var listeners = {};
              var dummy = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: Array.isArray(protocols) ? protocols[0] || '' : (protocols || ''),
                readyState: 1, // WebSocket.OPEN
                url: String(url),
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener: function(event, fn) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(function() {
                      try {
                        if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
                        fn({ type: 'open' });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(h) { return h !== fn; });
                  }
                },
                dispatchEvent: function(event) {
                  var list = listeners[event.type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i](event); } catch (e) {}
                  }
                  return true;
                },
                send: function() {},
                close: function() { dummy.readyState = 3; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return dummy;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = String(event.reason.message || event.reason);
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event) {
            var msg = String(event.message || '');
            var file = String(event.filename || '');
            if (msg.indexOf('WebSocket') !== -1 || file.indexOf('@vite/client') !== -1) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
